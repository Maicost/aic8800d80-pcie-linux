# AIC8800D80 em modo PCIe (WiFi) + aic_btusb (BT pela USB companheira).
# Fonte: zip oficial UGREEN CM958 (driver 6.4.3.0, 2025-07-29) + patches do AUR
# aic8800d80-pcie-dkms (compat 6.13+/7.1/7.2). Compilado com gcc (kernel Fedora).
PACKAGE_NAME="aic8800-pcie"
PACKAGE_VERSION="6.4.3.0"
AUTOINSTALL="yes"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/aic8800/aic8800_fdrv CONFIG_PLATFORM_UBUNTU=y modules && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/aic_btusb CONFIG_PLATFORM_UBUNTU=y modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/aic8800/aic8800_fdrv clean; make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/aic_btusb clean"
BUILT_MODULE_NAME[0]="aic8800D80_fdrv"
BUILT_MODULE_LOCATION[0]="drivers/aic8800/aic8800_fdrv"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless/aic8800D80"
BUILT_MODULE_NAME[1]="aic_btusb"
BUILT_MODULE_LOCATION[1]="aic_btusb"
DEST_MODULE_LOCATION[1]="/kernel/drivers/bluetooth"
